# GitHub turns off scheduled workflows after 60 days without a commit: one empty commit a month keeps the radar on.
name: Keepalive
on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "Livonian Labs"
          git config user.email "livonianlabs@gmail.com"
          git commit --allow-empty -m "Keepalive"
          git push
